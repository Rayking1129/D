<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Navos 本地制作工作台</title>
  <style>
    :root { --ink:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --blue:#0071e3; --bg:#f5f5f7; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
    .shell { min-height:100vh; display:grid; grid-template-columns: 360px minmax(0,1fr); }
    aside { padding:24px; border-right:1px solid var(--line); background:rgba(255,255,255,.75); display:grid; align-content:start; gap:18px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand img { width:48px; height:48px; border-radius:10px; }
    .brand h1 { margin:0; font-size:20px; line-height:1.15; }
    .brand p, .hint, .script p { margin:0; color:var(--muted); line-height:1.55; }
    main { padding:34px; display:grid; gap:18px; }
    .hero { display:flex; justify-content:space-between; gap:20px; align-items:start; }
    h2 { margin:0; font-size:48px; letter-spacing:-.04em; }
    .card { background:rgba(255,255,255,.88); border:1px solid rgba(255,255,255,.95); border-radius:10px; box-shadow:0 24px 70px rgba(0,0,0,.08); padding:20px; }
    form, .sync { display:grid; gap:14px; }
    label { display:grid; gap:8px; font-size:13px; font-weight:800; }
    input, select, textarea { width:100%; min-height:48px; border:1px solid var(--line); border-radius:9px; padding:12px 14px; font:inherit; background:#fff; outline:none; }
    textarea { min-height:118px; resize:vertical; line-height:1.55; }
    button, .btn { border:0; border-radius:999px; min-height:48px; padding:0 18px; background:#1d1d1f; color:#fff; font-weight:850; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
    button.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
    button:disabled { opacity:.52; cursor:not-allowed; }
    .grid { display:grid; grid-template-columns: minmax(320px,.8fr) minmax(0,1.2fr); gap:18px; align-items:start; }
    .scripts { display:grid; gap:12px; }
    .script { border:1px solid var(--line); border-radius:10px; background:#fff; padding:14px; display:grid; gap:10px; cursor:pointer; }
    .script.active { border-color:var(--blue); box-shadow:0 0 0 4px rgba(0,113,227,.12); }
    .script h3 { margin:0; font-size:17px; }
    .models { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .models button { border-radius:9px; background:#fff; color:var(--ink); border:1px solid var(--line); justify-content:flex-start; }
    .models button.active { background:#1d1d1f; color:#fff; border-color:#1d1d1f; }
    .toast { position:fixed; right:22px; bottom:22px; padding:13px 16px; background:#1d1d1f; color:#fff; border-radius:999px; box-shadow:0 18px 44px rgba(0,0,0,.24); opacity:0; transform:translateY(8px); transition:.2s; }
    .toast.show { opacity:1; transform:none; }
    @media (max-width: 980px) { .shell, .grid { grid-template-columns:1fr; } h2 { font-size:34px; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">
        <img src="assets/navos-logo.jpg" alt="Navos" />
        <div><h1>Navos<br />本地制作工作台</h1><p>共用飞书素材库与 OSS</p></div>
      </div>
      <form id="loginForm" class="card">
        <label>邮箱<input id="email" type="email" value="admin@creativehub.local" required /></label>
        <label>密码<input id="password" type="password" placeholder="Password" required /></label>
        <button type="submit">登录制作端</button>
      </form>
      <p class="hint">这个页面只用于本机制作团队。满意视频会上传 OSS，并写入同一张飞书素材库，线上审核端随后即可看到。</p>
      <a class="btn secondary" href="/">打开审核系统</a>
    </aside>
    <main>
      <section class="hero">
        <div>
          <h2>按商品生成脚本，上传满意视频，进入审核闭环。</h2>
          <p class="hint">本地制作端不面向客户上线，只共用数据库与素材源。</p>
        </div>
      </section>
      <section class="grid">
        <form id="scriptForm" class="card">
          <label>选择商品<select id="product" required></select></label>
          <label>创意方向
            <select id="direction">
              <option>街头穿搭 Streetwear Lifestyle</option>
              <option>产品故事 Product Story</option>
              <option>性能展示 Performance Demo</option>
              <option>UGC 开场钩子 UGC Hook</option>
              <option>新品预热 Launch Teaser</option>
              <option>视觉实验 Visual Experiment</option>
            </select>
          </label>
          <label>脚本数量<input id="count" type="number" min="1" max="8" value="3" /></label>
          <label>补充要求<textarea id="brief" placeholder="例如：15秒竖屏、前三秒强钩子、目标东南亚年轻男性、强调通勤穿搭。"></textarea></label>
          <button type="submit">生成创意脚本</button>
        </form>
        <div>
          <section class="card">
            <h3>创意脚本与视频 Prompt</h3>
            <div class="scripts" id="scripts"></div>
          </section>
          <section class="card sync">
            <label>选择视频模型<div class="models" id="models"></div></label>
            <label>素材标题<input id="assetTitle" required /></label>
            <label>上传满意视频<input id="video" type="file" accept="video/*" required /></label>
            <label>素材标签<input id="tags" value="制作端上传,待审核" /></label>
            <label>最终提示词<textarea id="prompt"></textarea></label>
            <button id="sync" type="button">上传并同步到飞书素材库</button>
          </section>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const API_BASE = "";
    const state = { token: localStorage.getItem("production-token") || "", products: [], scripts: [], selectedScript: 0, model: "Seedance 2.0" };
    const $ = (id) => document.getElementById(id);
    const toast = (text) => { $("toast").textContent = text; $("toast").classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").classList.remove("show"), 2200); };
    async function api(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      if (options.body && !(options.body instanceof FormData) && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
      return fetch(API_BASE + path, { ...options, headers });
    }
    const activeProducts = () => state.products.filter((p) => !["禁用","停用","disabled","inactive","off"].includes(String(p.status || "启用").trim().toLowerCase()));
    function renderProducts() {
      $("product").innerHTML = activeProducts().map((p) => `<option value="${p.id}">${p.name} · ${p.sku || p.id}</option>`).join("");
    }
    function productFeatures(product) { return Array.isArray(product?.features) ? product.features.filter(Boolean) : []; }
    function renderModels() {
      const models = ["Seedance 2.0", "Kling", "Veo", "Sora", "Runway", "Pika"];
      $("models").innerHTML = models.map((m) => `<button class="${state.model === m ? "active" : ""}" data-model="${m}" type="button">${m}</button>`).join("");
    }
    function renderScripts() {
      $("scripts").innerHTML = state.scripts.length ? state.scripts.map((s, i) => `<article class="script ${state.selectedScript === i ? "active" : ""}" data-index="${i}"><h3>${s.title}</h3><p>${s.script}</p><p><strong>Prompt:</strong> ${s.prompt}</p></article>`).join("") : `<p class="hint">先生成脚本。</p>`;
    }
    async function loadData() {
      if (!state.token) return;
      const res = await api("/api/bootstrap");
      if (!res.ok) return;
      const data = await res.json();
      state.products = data.products || [];
      renderProducts();
      toast("已连接飞书数据源");
    }
    function generateScripts() {
      const product = activeProducts().find((p) => p.id === $("product").value) || activeProducts()[0];
      const direction = $("direction").value;
      const count = Math.max(1, Math.min(8, Number($("count").value || 3)));
      const brief = $("brief").value.trim();
      const features = productFeatures(product);
      const angles = [["3秒强钩子","fast hand-held push-in"],["生活方式转场","match cut from street moment to product close-up"],["材质特写","macro detail of texture and logo"],["人群场景","young creator walking through city light"],["电商可投放","clean product reveal and strong hero frame"],["视觉实验","high contrast kinetic camera movement"]];
      state.scripts = Array.from({ length: count }, (_, i) => {
        const angle = angles[i % angles.length];
        const feature = features[i % Math.max(features.length, 1)] || product?.description || "核心卖点清晰可见";
        const title = `${product.name} · ${angle[0]}`;
        const script = `15秒竖屏。0-3秒用${angle[0]}建立注意力，3-10秒围绕「${feature}」展示商品与场景，10-15秒给到商品英雄镜头和可投放结尾。方向：${direction}${brief ? `。补充：${brief}` : ""}`;
        const prompt = `${angle[1]}, ${product.name} ${product.sku || product.id}, ${direction}, vertical 9:16, 15 seconds, premium realistic commercial video, smooth camera, sharp product detail, no distorted logo, no extra text. ${brief}`;
        return { title, script, prompt };
      });
      state.selectedScript = 0;
      $("assetTitle").value = state.scripts[0]?.title || "";
      $("prompt").value = state.scripts[0]?.prompt || "";
      renderScripts();
      toast("创意脚本已生成");
    }
    async function uploadFiles(files) {
      const fd = new FormData();
      files.forEach((file) => fd.append("files", file, file.name));
      const res = await api("/api/uploads", { method: "POST", body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "上传失败");
      return data.uploads || [];
    }
    async function syncAsset() {
      const product = activeProducts().find((p) => p.id === $("product").value);
      const script = state.scripts[state.selectedScript] || {};
      const file = $("video").files[0];
      if (!product) throw new Error("请选择商品");
      if (!file) throw new Error("请上传视频");
      $("sync").disabled = true;
      try {
        toast("正在上传 OSS...");
        const uploads = await uploadFiles([file]);
        const url = uploads[0]?.url;
        toast("正在写入飞书素材库...");
        const res = await api("/api/production/assets", { method: "POST", body: JSON.stringify({ productId: product.id, title: $("assetTitle").value || script.title, fileName: file.name, url, size: file.size, model: state.model, direction: $("direction").value, script: script.script || "", prompt: $("prompt").value || script.prompt || "", tags: $("tags").value.split(/[,，]/).map((x) => x.trim()).filter(Boolean) }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "同步失败");
        toast(`素材 ${data.assetId} 已进入审核库`);
      } finally {
        $("sync").disabled = false;
      }
    }
    $("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const res = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: $("email").value, password: $("password").value }) });
      const data = await res.json();
      if (!res.ok) return toast(data.error || "登录失败");
      state.token = data.token;
      localStorage.setItem("production-token", data.token);
      toast("登录成功");
      loadData();
    });
    $("scriptForm").addEventListener("submit", (event) => { event.preventDefault(); generateScripts(); });
    $("scripts").addEventListener("click", (event) => {
      const card = event.target.closest(".script");
      if (!card) return;
      state.selectedScript = Number(card.dataset.index || 0);
      $("assetTitle").value = state.scripts[state.selectedScript]?.title || "";
      $("prompt").value = state.scripts[state.selectedScript]?.prompt || "";
      renderScripts();
    });
    $("models").addEventListener("click", (event) => {
      const btn = event.target.closest("[data-model]");
      if (!btn) return;
      state.model = btn.dataset.model;
      renderModels();
    });
    $("sync").addEventListener("click", () => syncAsset().catch((error) => toast(error.message)));
    renderModels();
    loadData();
  </script>
</body>
</html>
