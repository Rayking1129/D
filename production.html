<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Navos 本地制作工作台</title>
  <style>
    :root {
      --ink:#1d1d1f; --muted:#6e6e73; --soft:#f5f5f7; --line:#e5e5ea;
      --blue:#0071e3; --green:#1f8f45; --amber:#b86b00; --red:#c0352b;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:radial-gradient(circle at 70% 0%,#fff 0,#f5f5f7 46%,#ececf1 100%); }
    .shell { min-height:100vh; display:grid; grid-template-columns:340px minmax(0,1fr); }
    aside { padding:24px; border-right:1px solid var(--line); background:rgba(255,255,255,.78); backdrop-filter:blur(22px); display:grid; align-content:start; gap:18px; }
    main { padding:32px; display:grid; gap:18px; }
    .brand { display:flex; gap:12px; align-items:center; }
    .brand img { width:52px; height:52px; border-radius:12px; object-fit:cover; box-shadow:0 18px 36px rgba(0,0,0,.16); }
    h1,h2,h3,p { margin:0; }
    .brand h1 { font-size:20px; line-height:1.12; letter-spacing:-.02em; }
    .muted { color:var(--muted); line-height:1.55; }
    h2 { max-width:980px; font-size:48px; line-height:1.02; letter-spacing:-.055em; }
    .eyebrow { color:var(--blue); font-weight:900; letter-spacing:.12em; font-size:12px; text-transform:uppercase; }
    .card { background:rgba(255,255,255,.9); border:1px solid rgba(255,255,255,.96); border-radius:14px; box-shadow:0 24px 70px rgba(0,0,0,.08); padding:18px; }
    .panel { display:grid; grid-template-columns:minmax(320px,.78fr) minmax(0,1.22fr); gap:18px; align-items:start; }
    form,.stack { display:grid; gap:14px; }
    label { display:grid; gap:8px; font-size:13px; font-weight:850; }
    input,select,textarea { width:100%; min-height:48px; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font:inherit; background:#fff; outline:none; transition:.18s; position:relative; z-index:1; }
    textarea { min-height:108px; resize:vertical; line-height:1.55; }
    input:focus,select:focus,textarea:focus { border-color:var(--blue); box-shadow:0 0 0 4px rgba(0,113,227,.12); }
    button,.btn { border:0; border-radius:999px; min-height:48px; padding:0 18px; background:#1d1d1f; color:#fff; font-weight:900; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; transition:transform .16s, box-shadow .16s, opacity .16s; }
    button:hover,.btn:hover { transform:translateY(-1px); box-shadow:0 12px 28px rgba(0,0,0,.12); }
    button:disabled { opacity:.55; cursor:not-allowed; transform:none; box-shadow:none; }
    button.secondary,.btn.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
    button.blue { background:var(--blue); }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .scripts,.tasks { display:grid; gap:10px; }
    .script,.task { border:1px solid var(--line); border-radius:13px; background:#fff; padding:14px; display:grid; gap:10px; }
    .script { cursor:pointer; }
    .script.active { border-color:var(--blue); box-shadow:0 0 0 4px rgba(0,113,227,.12); }
    .script h3,.task h3 { font-size:16px; }
    .script p,.task p { color:var(--muted); line-height:1.52; font-size:14px; }
    .models { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .model { min-height:58px; border-radius:12px; background:#fff; color:var(--ink); border:1px solid var(--line); justify-content:flex-start; text-align:left; padding:0 14px; }
    .model.active { background:#1d1d1f; color:#fff; border-color:#1d1d1f; }
    .controls { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .script-controls { grid-template-columns:1fr; }
    .status { width:max-content; border-radius:999px; padding:5px 9px; font-size:12px; font-weight:900; background:#eef0f4; color:#626873; }
    .status.completed { color:var(--green); background:#e5f6eb; }
    .status.failed { color:var(--red); background:#fee9e7; }
    .status.processing,.status.running,.status.pending { color:var(--amber); background:#fff2d7; }
    video { width:100%; max-height:260px; border-radius:12px; background:#050505; object-fit:contain; }
    .toast { position:fixed; right:22px; bottom:22px; padding:13px 16px; background:#1d1d1f; color:#fff; border-radius:999px; box-shadow:0 18px 44px rgba(0,0,0,.24); opacity:0; transform:translateY(8px); transition:.2s; z-index:20; }
    .toast.show { opacity:1; transform:none; }
    .spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:999px; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width:1050px) { .shell,.panel { grid-template-columns:1fr; } h2 { font-size:34px; } .models,.controls { grid-template-columns:1fr 1fr; } .script-controls { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">
        <img src="assets/navos-logo.jpg" alt="Navos" />
        <div>
          <h1>Navos<br />本地制作工作台</h1>
          <p class="muted">共用飞书素材库与 OSS</p>
        </div>
      </div>
      <form id="loginForm" class="card">
        <label>邮箱<input id="email" type="email" value="admin@creativehub.local" required /></label>
        <label>密码<input id="password" type="password" placeholder="Password" required /></label>
        <button id="loginButton" type="submit">登录制作端</button>
      </form>
      <a class="btn secondary" href="/">打开审核系统</a>
      <p class="muted">本页面只允许本机访问。满意的视频同步到飞书素材库后，线上审核团队会看到同一个素材数据源。</p>
    </aside>

    <main>
      <section class="stack">
        <p class="eyebrow">Local Production OS</p>
        <h2>按商品生成创意脚本，多模型并发出片，满意后进入审核闭环。</h2>
      </section>

      <section class="panel">
        <form id="scriptForm" class="card">
          <label>选择商品<select id="product" required></select></label>
          <label>创意方向
            <select id="direction">
              <option>Streetwear Lifestyle</option>
              <option>Product Story</option>
              <option>Performance Demo</option>
              <option>UGC Hook</option>
              <option>Launch Teaser</option>
              <option>Visual Experiment</option>
            </select>
          </label>
          <div class="controls script-controls">
            <label>脚本数量<input id="scriptCount" type="number" min="1" max="8" value="3" /></label>
          </div>
          <label>补充要求<textarea id="brief" placeholder="例如：前 3 秒强钩子、面向海外 TikTok、强调通勤穿搭、无字幕无口播。"></textarea></label>
          <button id="scriptButton" type="submit">生成创意脚本</button>
        </form>

        <div class="stack">
          <section class="card stack">
            <div class="row" style="justify-content:space-between">
              <div>
                <h3>脚本候选</h3>
                <p class="muted">选择一条脚本后，可同时发给多个视频模型。</p>
              </div>
              <button id="videoButton" class="blue" type="button">生成视频任务</button>
            </div>
            <div class="scripts" id="scripts"></div>
          </section>

          <section class="card stack">
            <div>
              <h3>视频模型</h3>
              <p class="muted">支持多选，提交后会并发创建任务。</p>
            </div>
            <div class="models" id="models"></div>
            <div class="controls">
              <label>每模型视频数<input id="batchCount" type="number" min="1" max="6" value="1" /></label>
              <label>视频时长<input id="duration" type="number" min="3" max="30" value="15" /></label>
              <label>画面比例
                <select id="ratio">
                  <option>9:16</option>
                  <option>16:9</option>
                  <option>1:1</option>
                </select>
              </label>
            </div>
          </section>

          <section class="card stack">
            <div>
              <h3>生成队列</h3>
              <p class="muted">完成后可预览，并一键同步为飞书素材库待审核素材。</p>
            </div>
            <div class="tasks" id="tasks"></div>
          </section>

          <section class="card stack">
            <h3>手动上传兜底</h3>
            <label>素材标题<input id="manualTitle" /></label>
            <label>上传满意视频<input id="manualVideo" type="file" accept="video/*" /></label>
            <label>素材标签<input id="tags" value="制作端上传,待审核" /></label>
            <label>最终提示词<textarea id="prompt"></textarea></label>
            <button id="manualSync" type="button">上传并同步到素材库</button>
          </section>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const state = {
      token: localStorage.getItem("production-token") || "",
      products: [],
      scripts: [],
      selectedScript: 0,
      selectedModels: new Set(["Seedance2.5", "Seedance2.0-fast"]),
      tasks: [],
      poller: null
    };

    const MODEL_OPTIONS = [
      { id: "Seedance2.5", name: "Seedance 2.5" },
      { id: "Seedance2.0", name: "Seedance 2.0" },
      { id: "Seedance2.0-fast", name: "Seedance Fast" },
      { id: "kling-2.5-turbo", name: "Kling 2.5 Turbo" },
      { id: "veo-3.1-fast", name: "Veo 3.1 Fast" },
      { id: "MiniMax-H3", name: "MiniMax H3" },
      { id: "happyhorse-t2v", name: "HappyHorse T2V" }
    ];

    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value || "").replace(/[&<>"']/g, (char) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[char]));
    const toast = (text) => {
      $("toast").textContent = text;
      $("toast").classList.add("show");
      clearTimeout(toast.t);
      toast.t = setTimeout(() => $("toast").classList.remove("show"), 2400);
    };
    async function api(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      if (options.body && !(options.body instanceof FormData) && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
      return fetch(path, { ...options, headers });
    }
    function setBusy(button, busy, text) {
      if (!button) return;
      if (!button.dataset.label) button.dataset.label = button.textContent;
      button.disabled = busy;
      button.innerHTML = busy ? `<span class="spinner"></span>${escapeHtml(text || "处理中")}` : button.dataset.label;
    }
    const activeProducts = () => state.products.filter((p) => !["禁用","停用","disabled","inactive","off"].includes(String(p.status || "启用").trim().toLowerCase()));
    const selectedProduct = () => activeProducts().find((p) => p.id === $("product").value) || activeProducts()[0];
    function productReferenceImages(product) {
      const urls = [product?.cover, ...(Array.isArray(product?.detailImages) ? product.detailImages : [])]
        .filter(Boolean)
        .map((url) => typeof url === "string" ? url : (url.link || url.url || url.text || ""))
        .filter((url) => /^https?:\/\//i.test(url));
      return [...new Set(urls)].slice(0, 6);
    }
    function renderProducts() {
      const products = activeProducts();
      $("product").disabled = !products.length;
      $("product").innerHTML = products.length
        ? products.map((p) => `<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)} · ${escapeHtml(p.sku || p.id)}</option>`).join("")
        : `<option value="">暂无可用商品，请检查商品库启用状态</option>`;
    }
    function renderModels() {
      $("models").innerHTML = MODEL_OPTIONS.map((model) => `
        <button type="button" class="model ${state.selectedModels.has(model.id) ? "active" : ""}" data-model="${escapeHtml(model.id)}">
          ${escapeHtml(model.name)}
        </button>
      `).join("");
    }
    function renderScripts() {
      $("scripts").innerHTML = state.scripts.length ? state.scripts.map((script, index) => `
        <article class="script ${state.selectedScript === index ? "active" : ""}" data-index="${index}">
          <h3>${escapeHtml(script.title)}</h3>
          <p>${escapeHtml(script.script)}</p>
          <p><strong>Prompt:</strong> ${escapeHtml(script.prompt)}</p>
        </article>
      `).join("") : `<p class="muted">先选择商品并生成脚本。</p>`;
    }
    function renderTasks() {
      $("tasks").innerHTML = state.tasks.length ? state.tasks.map((task) => `
        <article class="task">
          <div class="row" style="justify-content:space-between">
            <div>
              <h3>${escapeHtml(task.title || "Video Task")}</h3>
              <p>${escapeHtml(task.modelName || task.model)} · ${task.copy ? `第 ${task.copy} 条` : ""}</p>
            </div>
            <span class="status ${escapeHtml(task.status)}">${escapeHtml(statusLabel(task.status))}</span>
          </div>
          ${task.url ? `<video src="${escapeHtml(task.url)}" controls playsinline></video>` : ""}
          ${task.error ? `<p style="color:var(--red)">${escapeHtml(task.error)}</p>` : ""}
          ${task.message ? `<p>${escapeHtml(task.message)}</p>` : ""}
          <div class="row">
            ${task.url ? `<a class="btn secondary" href="${escapeHtml(task.url)}" target="_blank" rel="noreferrer">打开视频</a>` : ""}
            ${task.url && !task.synced ? `<button type="button" data-sync="${escapeHtml(task.localId)}">同步到素材库</button>` : ""}
            ${task.synced ? `<span class="status completed">已同步素材 ${escapeHtml(task.assetId || "")}</span>` : ""}
          </div>
        </article>
      `).join("") : `<p class="muted">还没有生成任务。</p>`;
    }
    function statusLabel(status) {
      return { pending:"排队中", processing:"生成中", running:"生成中", completed:"已完成", failed:"失败" }[String(status || "").toLowerCase()] || status || "未知";
    }
    async function loadData() {
      if (!state.token) return;
      $("product").disabled = true;
      $("product").innerHTML = `<option value="">商品加载中...</option>`;
      const res = await api("/api/bootstrap");
      if (!res.ok) {
        $("product").innerHTML = `<option value="">商品加载失败，请重新登录</option>`;
        return;
      }
      const data = await res.json();
      state.products = data.products || [];
      renderProducts();
      toast("已连接飞书数据源");
    }
    async function generateScripts() {
      const product = selectedProduct();
      if (!product) throw new Error("请先配置可用商品");
      setBusy($("scriptButton"), true, "生成中");
      try {
        const payload = { product, direction: $("direction").value, count: $("scriptCount").value, brief: $("brief").value };
        const res = await api("/api/production/scripts", { method: "POST", body: JSON.stringify(payload) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "脚本生成失败");
        state.scripts = data.scripts || [];
        state.selectedScript = 0;
        $("manualTitle").value = state.scripts[0]?.title || "";
        $("prompt").value = state.scripts[0]?.prompt || "";
        renderScripts();
        toast(data.provider === "deepseek" ? "DeepSeek 已生成脚本" : "DeepSeek key 未配置，已使用本地模板生成");
      } finally {
        setBusy($("scriptButton"), false);
      }
    }
    async function createVideos() {
      if (!state.scripts.length) throw new Error("请先生成脚本");
      if (!state.selectedModels.size) throw new Error("请至少选择一个模型");
      const script = state.scripts[state.selectedScript];
      setBusy($("videoButton"), true, "提交中");
      toast("已提交生成任务，后台会继续处理");
      try {
        const models = [...state.selectedModels].map((id) => MODEL_OPTIONS.find((model) => model.id === id) || { id, name: id });
        const res = await api("/api/production/videos", {
          method: "POST",
          body: JSON.stringify({
            scripts: [script],
            models,
            product: selectedProduct(),
            referenceImages: productReferenceImages(selectedProduct()),
            countPerModel: $("batchCount").value,
            ratio: $("ratio").value,
            duration: $("duration").value,
            resolution: "720p",
            generateAudio: true
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "视频任务创建失败");
        state.tasks = [...(data.tasks || []), ...state.tasks];
        renderTasks();
        startPolling();
        toast(`已创建 ${data.tasks.length} 个视频任务`);
      } finally {
        setBusy($("videoButton"), false);
      }
    }
    function startPolling() {
      if (state.poller) return;
      state.poller = setInterval(pollTasks, 4000);
      pollTasks();
    }
    async function pollTasks() {
      const active = state.tasks.filter((task) => task.taskId && !["completed","failed"].includes(String(task.status).toLowerCase()));
      if (!active.length) {
        clearInterval(state.poller);
        state.poller = null;
        return;
      }
      await Promise.all(active.map(async (task) => {
        try {
          const res = await api(`/api/production/videos/${encodeURIComponent(task.taskId)}`);
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "轮询失败");
          Object.assign(task, data.task, { localId: task.localId, model: task.model, modelName: task.modelName, title: task.title, script: task.script, prompt: task.prompt, copy: task.copy });
        } catch (error) {
          task.message = error.message;
        }
      }));
      renderTasks();
    }
    async function uploadFiles(files) {
      const fd = new FormData();
      files.forEach((file) => fd.append("files", file, file.name));
      const res = await api("/api/uploads", { method: "POST", body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "上传失败");
      return data.uploads || [];
    }
    async function syncPayload(payload, button) {
      const product = selectedProduct();
      if (!product) throw new Error("请选择商品");
      setBusy(button, true, "同步中");
      try {
        const res = await api("/api/production/assets", { method: "POST", body: JSON.stringify({ productId: product.id, tags: $("tags").value.split(/[,，]/).map((x) => x.trim()).filter(Boolean), direction: $("direction").value, ...payload }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "同步失败");
        toast(`素材 ${data.assetId} 已进入审核库`);
        return data;
      } finally {
        setBusy(button, false);
      }
    }
    async function syncGeneratedAsset(localId, button) {
      const task = state.tasks.find((item) => item.localId === localId);
      if (!task?.url) throw new Error("视频还没有生成完成");
      const data = await syncPayload({
        title: task.title,
        fileName: `${task.title || "generated-video"}_${task.model || "model"}.mp4`,
        url: task.url,
        size: 0,
        model: task.modelName || task.model,
        script: task.script || "",
        prompt: task.prompt || ""
      }, button);
      task.synced = true;
      task.assetId = data.assetId;
      renderTasks();
    }
    async function syncManualAsset() {
      const file = $("manualVideo").files[0];
      if (!file) throw new Error("请上传视频");
      setBusy($("manualSync"), true, "上传中");
      try {
        toast("正在上传 OSS...");
        const uploads = await uploadFiles([file]);
        const script = state.scripts[state.selectedScript] || {};
        await syncPayload({
          title: $("manualTitle").value || script.title || file.name,
          fileName: file.name,
          url: uploads[0]?.url,
          size: file.size,
          model: "Manual Upload",
          script: script.script || "",
          prompt: $("prompt").value || script.prompt || ""
        }, $("manualSync"));
      } finally {
        setBusy($("manualSync"), false);
      }
    }

    $("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      setBusy($("loginButton"), true, "登录中");
      try {
        const res = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: $("email").value, password: $("password").value }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "登录失败");
        state.token = data.token;
        localStorage.setItem("production-token", data.token);
        toast("登录成功");
        await loadData();
      } catch (error) {
        toast(error.message);
      } finally {
        setBusy($("loginButton"), false);
      }
    });
    $("scriptForm").addEventListener("submit", (event) => { event.preventDefault(); generateScripts().catch((error) => toast(error.message)); });
    $("videoButton").addEventListener("click", () => createVideos().catch((error) => toast(error.message)));
    $("manualSync").addEventListener("click", () => syncManualAsset().catch((error) => toast(error.message)));
    $("scripts").addEventListener("click", (event) => {
      const card = event.target.closest(".script");
      if (!card) return;
      state.selectedScript = Number(card.dataset.index || 0);
      $("manualTitle").value = state.scripts[state.selectedScript]?.title || "";
      $("prompt").value = state.scripts[state.selectedScript]?.prompt || "";
      renderScripts();
    });
    $("models").addEventListener("click", (event) => {
      const button = event.target.closest("[data-model]");
      if (!button) return;
      const id = button.dataset.model;
      if (state.selectedModels.has(id)) state.selectedModels.delete(id);
      else state.selectedModels.add(id);
      renderModels();
    });
    $("tasks").addEventListener("click", (event) => {
      const button = event.target.closest("[data-sync]");
      if (!button) return;
      syncGeneratedAsset(button.dataset.sync, button).catch((error) => toast(error.message));
    });

    renderModels();
    renderScripts();
    renderTasks();
    loadData();
  </script>
</body>
</html>
